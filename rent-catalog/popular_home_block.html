<!-- ARENA PSGM — Популярно сейчас (главная): игры из Mini App, релиз ≤90 дней, 3–4 квадратные карточки -->
<div id="arena-popular-home" class="aph" aria-label="Популярно сейчас" hidden>
  <div class="aph-head">
    <h2 class="aph-title">Популярно сейчас</h2>
    <p class="aph-sub">Свежие хиты · аренда на PS4 / PS5</p>
  </div>
  <div class="aph-grid" id="aphGrid"></div>
</div>
<style id="arena-popular-home-styles">
#arena-popular-home.aph{
  --aph-ink:#141820;
  --aph-muted:#6b7589;
  --aph-accent:#F15A22;
  --aph-line:rgba(20,24,32,.08);
  --aph-card:#fff;
  --aph-soft:#f6f7f9;
  box-sizing:border-box;
  width:100%;
  max-width:1080px;
  margin:0 auto;
  padding:8px 16px 28px;
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
  color:var(--aph-ink);
}
#arena-popular-home.aph[hidden]{display:none!important}
#arena-popular-home.aph *,#arena-popular-home.aph *:before,#arena-popular-home.aph *:after{box-sizing:border-box}
#arena-popular-home .aph-head{text-align:center;margin:0 0 18px}
#arena-popular-home .aph-title{
  margin:0;
  font-size:clamp(22px,2.6vw,28px);
  font-weight:800;
  letter-spacing:-.02em;
  color:var(--aph-accent);
}
#arena-popular-home .aph-sub{
  margin:6px 0 0;
  font-size:14px;
  font-weight:600;
  color:var(--aph-muted);
}
#arena-popular-home .aph-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
}
#arena-popular-home .aph-card{
  display:flex;
  flex-direction:column;
  text-decoration:none;
  color:inherit;
  background:var(--aph-card);
  border:1px solid var(--aph-line);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 10px 28px rgba(15,23,42,.08);
  transition:transform .28s cubic-bezier(.22,1,.36,1), box-shadow .28s ease, border-color .28s ease;
  opacity:0;
  transform:translateY(12px);
  animation:aphIn .55s ease forwards;
}
#arena-popular-home .aph-card:nth-child(1){animation-delay:.05s}
#arena-popular-home .aph-card:nth-child(2){animation-delay:.12s}
#arena-popular-home .aph-card:nth-child(3){animation-delay:.19s}
#arena-popular-home .aph-card:nth-child(4){animation-delay:.26s}
#arena-popular-home .aph-card:hover{
  transform:translateY(-4px);
  border-color:rgba(241,90,34,.35);
  box-shadow:0 18px 40px rgba(15,23,42,.14), 0 0 0 1px rgba(241,90,34,.12);
}
#arena-popular-home .aph-card:active{transform:scale(.985)}
#arena-popular-home .aph-cover{
  position:relative;
  aspect-ratio:1/1;
  background:var(--aph-soft);
  overflow:hidden;
}
#arena-popular-home .aph-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .45s cubic-bezier(.22,1,.36,1);
}
#arena-popular-home .aph-card:hover .aph-cover img{transform:scale(1.05)}
#arena-popular-home .aph-badge{
  position:absolute;
  left:10px;
  top:10px;
  z-index:1;
  padding:5px 9px;
  border-radius:999px;
  background:rgba(20,24,32,.72);
  color:#fff;
  font-size:11px;
  font-weight:700;
  letter-spacing:.02em;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
#arena-popular-home .aph-body{
  display:flex;
  flex-direction:column;
  gap:8px;
  padding:12px 12px 14px;
  min-height:86px;
}
#arena-popular-home .aph-name{
  margin:0;
  font-size:14px;
  font-weight:750;
  line-height:1.25;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  min-height:2.5em;
}
#arena-popular-home .aph-meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
#arena-popular-home .aph-price{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:30px;
  padding:0 10px;
  border-radius:999px;
  background:var(--aph-accent);
  color:#fff;
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
}
#arena-popular-home .aph-date{
  font-size:11px;
  font-weight:650;
  color:var(--aph-muted);
  white-space:nowrap;
}
@keyframes aphIn{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
@media (max-width:900px){
  #arena-popular-home .aph-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
}
@media (max-width:420px){
  #arena-popular-home.aph{padding:4px 12px 20px}
  #arena-popular-home .aph-body{padding:10px 10px 12px;min-height:78px}
  #arena-popular-home .aph-name{font-size:13px}
}
@media (prefers-reduced-motion:reduce){
  #arena-popular-home .aph-card,
  #arena-popular-home .aph-cover img{animation:none;transition:none;opacity:1;transform:none}
}
</style>
<script id="arena-popular-home-js">
(function(){
  var ROOT_ID='arena-popular-home';
  var GRID_ID='aphGrid';
  var CARD_MIN=3;
  var CARD_MAX=4;
  var WINDOW_DAYS=90;
  var RENT_BASE='https://arenapsgm.ru/gamerentps#rent/';
  var JSON_URLS=[
    'https://raw.githubusercontent.com/chekoli911/game-discountsArenaSALE/main/rent-catalog/popular_home_cards.json',
    'https://raw.githubusercontent.com/chekoli911/game-discountsArenaSALE/refs/heads/main/rent-catalog/popular_home_cards.json',
    'https://cdn.jsdelivr.net/gh/chekoli911/game-discountsArenaSALE@main/rent-catalog/popular_home_cards.json'
  ];

  function esc(s){
    return String(s||'').replace(/[&<>"']/g,function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }
  function stripMarks(s){
    return String(s||'').replace(/[™®©]/g,'').replace(/\s{2,}/g,' ').trim();
  }
  function parseRelease(raw){
    var s=String(raw||'').trim();
    var m=s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})$/);
    if(!m) return null;
    var d=new Date(+m[3], +m[2]-1, +m[1]);
    return isNaN(d.getTime())?null:d;
  }
  function daysBetween(a,b){
    return Math.floor((a.getTime()-b.getTime())/(24*3600*1000));
  }
  function withinWindow(item, today){
    var rd=parseRelease(item && item.release_date);
    if(!rd) return false;
    if(rd>today) return false;
    return daysBetween(today, rd) <= WINDOW_DAYS;
  }
  function shuffle(list){
    var arr=list.slice();
    for(var i=arr.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=arr[i]; arr[i]=arr[j]; arr[j]=t;
    }
    return arr;
  }
  function pickCount(n){
    if(n<=CARD_MIN) return n;
    return Math.random()<0.55 ? CARD_MAX : CARD_MIN;
  }
  function priceLabel(v){
    var n=Number(v||0);
    if(!n) return 'Аренда';
    return 'от '+n.toLocaleString('ru-RU')+'₽';
  }
  function cardHtml(item){
    var title=stripMarks(item.title||item.title_full||'');
    var img=item.image_url||'';
    var href=RENT_BASE+encodeURIComponent(item.slug||'');
    var rd=item.release_date||'';
    return (
      '<a class="aph-card" href="'+esc(href)+'">'+
        '<div class="aph-cover">'+
          '<span class="aph-badge">Хит</span>'+
          (img?'<img src="'+esc(img)+'" alt="'+esc(title)+'" loading="lazy" decoding="async">':'')+
        '</div>'+
        '<div class="aph-body">'+
          '<div class="aph-name">'+esc(title)+'</div>'+
          '<div class="aph-meta">'+
            '<span class="aph-price">'+esc(priceLabel(item.price_min))+'</span>'+
            (rd?'<span class="aph-date">'+esc(rd)+'</span>':'')+
          '</div>'+
        '</div>'+
      '</a>'
    );
  }
  function mount(items){
    var root=document.getElementById(ROOT_ID);
    var grid=document.getElementById(GRID_ID);
    if(!root||!grid) return;
    var today=new Date();
    today=new Date(today.getFullYear(), today.getMonth(), today.getDate());
    var eligible=(items||[]).filter(function(it){
      return it && it.slug && it.image_url && withinWindow(it, today);
    });
    if(eligible.length<1){
      root.hidden=true;
      root.setAttribute('hidden','');
      grid.innerHTML='';
      return;
    }
    var picked=shuffle(eligible).slice(0, pickCount(eligible.length));
    // если выпало 3 при наличии 4+ — ок; всегда 3–4
    if(picked.length>CARD_MAX) picked=picked.slice(0,CARD_MAX);
    grid.innerHTML=picked.map(cardHtml).join('');
    root.hidden=false;
    root.removeAttribute('hidden');
  }
  function fetchJson(urls){
    var i=0;
    function next(){
      if(i>=urls.length) return Promise.reject(new Error('no source'));
      var u=urls[i++]+(urls[i-1].indexOf('?')>=0?'&':'?')+'t='+Date.now();
      return fetch(u,{cache:'no-store'}).then(function(r){
        if(!r.ok) throw new Error('HTTP '+r.status);
        return r.json();
      }).catch(function(){ return next(); });
    }
    return next();
  }
  function boot(){
    fetchJson(JSON_URLS).then(function(data){
      mount((data&&data.items)||[]);
    }).catch(function(err){
      console.warn('[arena-popular-home]', err);
      var root=document.getElementById(ROOT_ID);
      if(root){ root.hidden=true; root.setAttribute('hidden',''); }
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
