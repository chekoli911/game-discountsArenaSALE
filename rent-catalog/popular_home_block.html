<!-- ARENA PSGM — Выбор пользователей: 3 карточки (крупная слева + 2 справа), без рамок -->
<div id="arena-popular-home" class="aph" aria-label="Выбор пользователей" hidden>
  <div class="aph-head">
    <h2 class="aph-title">Выбор пользователей</h2>
  </div>
  <div class="aph-mosaic" id="aphGrid"></div>
</div>
<style id="arena-popular-home-styles">
#arena-popular-home.aph{
  --aph-ink:#141820;
  --aph-muted:#6b7589;
  --aph-accent:#F15A22;
  --aph-gap:6px;
  --aph-radius:16px;
  box-sizing:border-box;
  width:100%;
  max-width:1000px;
  margin:0 auto;
  padding:4px 16px 24px;
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
  color:var(--aph-ink);
}
#arena-popular-home.aph[hidden]{display:none!important}
#arena-popular-home.aph *,#arena-popular-home.aph *:before,#arena-popular-home.aph *:after{box-sizing:border-box}
#arena-popular-home .aph-head{text-align:center;margin:0 0 14px}
#arena-popular-home .aph-title{
  margin:0;
  font-size:clamp(22px,2.6vw,28px);
  font-weight:800;
  letter-spacing:-.02em;
  color:var(--aph-accent);
}
#arena-popular-home .aph-mosaic{
  display:grid;
  grid-template-columns:1.12fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:var(--aph-gap);
  aspect-ratio:2 / 1.02;
  width:100%;
  border-radius:var(--aph-radius);
  overflow:hidden;
  background:transparent;
}
#arena-popular-home .aph-card{
  position:relative;
  display:block;
  margin:0;
  padding:0;
  border:0;
  text-decoration:none;
  color:#fff;
  overflow:hidden;
  background:#0e1118;
  min-width:0;
  min-height:0;
  opacity:0;
  animation:aphIn .5s ease forwards;
}
#arena-popular-home .aph-card:nth-child(1){
  grid-column:1;
  grid-row:1 / span 2;
  animation-delay:.04s;
}
#arena-popular-home .aph-card:nth-child(2){
  grid-column:2;
  grid-row:1;
  animation-delay:.1s;
}
#arena-popular-home .aph-card:nth-child(3){
  grid-column:2;
  grid-row:2;
  animation-delay:.16s;
}
#arena-popular-home .aph-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .45s cubic-bezier(.22,1,.36,1);
}
#arena-popular-home .aph-card:hover img{transform:scale(1.045)}
#arena-popular-home .aph-card:active{filter:brightness(.96)}
#arena-popular-home .aph-shade{
  position:absolute;
  inset:auto 0 0 0;
  height:46%;
  background:linear-gradient(180deg,transparent,rgba(8,10,16,.78));
  pointer-events:none;
}
#arena-popular-home .aph-info{
  position:absolute;
  left:0;right:0;bottom:0;
  z-index:1;
  padding:14px 14px 12px;
  display:flex;
  flex-direction:column;
  gap:6px;
  pointer-events:none;
}
#arena-popular-home .aph-name{
  margin:0;
  font-size:clamp(13px,1.5vw,16px);
  font-weight:750;
  line-height:1.2;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  text-shadow:0 1px 8px rgba(0,0,0,.45);
}
#arena-popular-home .aph-card:nth-child(1) .aph-name{font-size:clamp(15px,1.8vw,19px)}
#arena-popular-home .aph-price{
  display:inline-flex;
  align-self:flex-start;
  align-items:center;
  min-height:26px;
  padding:0 10px;
  border-radius:999px;
  background:rgba(241,90,34,.96);
  color:#fff;
  font-size:12px;
  font-weight:800;
  letter-spacing:.01em;
  box-shadow:0 6px 16px rgba(0,0,0,.25);
}
#arena-popular-home .aph-card:nth-child(1) .aph-price{
  min-height:30px;
  font-size:13px;
  padding:0 12px;
}
@keyframes aphIn{
  from{opacity:0}
  to{opacity:1}
}
@media (max-width:700px){
  #arena-popular-home.aph{padding:2px 12px 18px}
  #arena-popular-home .aph-mosaic{
    aspect-ratio:1 / 1.05;
    --aph-gap:5px;
    --aph-radius:14px;
  }
  #arena-popular-home .aph-info{padding:10px 10px 9px;gap:5px}
  #arena-popular-home .aph-name{font-size:12px;-webkit-line-clamp:2}
  #arena-popular-home .aph-card:nth-child(1) .aph-name{font-size:14px}
  #arena-popular-home .aph-price{min-height:24px;font-size:11px;padding:0 8px}
  #arena-popular-home .aph-card:nth-child(1) .aph-price{min-height:26px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  #arena-popular-home .aph-card,
  #arena-popular-home .aph-card img{animation:none;transition:none;opacity:1;transform:none}
}
</style>
<script id="arena-popular-home-js">
(function(){
  var ROOT_ID='arena-popular-home';
  var GRID_ID='aphGrid';
  var CARD_COUNT=3;
  var WINDOW_DAYS=90;
  var RENT_BASE='https://arenapsgm.ru/gamerentps#rent/';
  var JSON_URLS=[
    'https://raw.githubusercontent.com/chekoli911/game-discountsArenaSALE/main/rent-catalog/popular_home_cards.json',
    'https://raw.githubusercontent.com/chekoli911/game-discountsArenaSALE/refs/heads/main/rent-catalog/popular_home_cards.json',
    'https://cdn.jsdelivr.net/gh/chekoli911/game-discountsArenaSALE@main/rent-catalog/popular_home_cards.json'
  ];

  function esc(s){
    return String(s||'').replace(/[&<>"']/g,function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }
  function stripMarks(s){
    return String(s||'').replace(/[™®©]/g,'').replace(/\s{2,}/g,' ').trim();
  }
  function parseRelease(raw){
    var s=String(raw||'').trim();
    var m=s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})$/);
    if(!m) return null;
    var d=new Date(+m[3], +m[2]-1, +m[1]);
    return isNaN(d.getTime())?null:d;
  }
  function daysBetween(a,b){
    return Math.floor((a.getTime()-b.getTime())/(24*3600*1000));
  }
  function withinWindow(item, today){
    var rd=parseRelease(item && item.release_date);
    if(!rd) return false;
    if(rd>today) return false;
    return daysBetween(today, rd) <= WINDOW_DAYS;
  }
  function shuffle(list){
    var arr=list.slice();
    for(var i=arr.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));
      var t=arr[i]; arr[i]=arr[j]; arr[j]=t;
    }
    return arr;
  }
  function priceLabel(v){
    var n=Number(v||0);
    if(!n) return 'Аренда';
    return 'от '+n.toLocaleString('ru-RU')+'₽';
  }
  function cardHtml(item){
    var title=stripMarks(item.title||item.title_full||'');
    var img=item.image_url||'';
    var href=RENT_BASE+encodeURIComponent(item.slug||'');
    return (
      '<a class="aph-card" href="'+esc(href)+'" aria-label="'+esc(title)+'">'+
        (img?'<img src="'+esc(img)+'" alt="'+esc(title)+'" loading="lazy" decoding="async">':'')+
        '<div class="aph-shade"></div>'+
        '<div class="aph-info">'+
          '<div class="aph-name">'+esc(title)+'</div>'+
          '<span class="aph-price">'+esc(priceLabel(item.price_min))+'</span>'+
        '</div>'+
      '</a>'
    );
  }
  function mount(items){
    var root=document.getElementById(ROOT_ID);
    var grid=document.getElementById(GRID_ID);
    if(!root||!grid) return;
    var today=new Date();
    today=new Date(today.getFullYear(), today.getMonth(), today.getDate());
    var eligible=(items||[]).filter(function(it){
      return it && it.slug && it.image_url && withinWindow(it, today);
    });
    if(eligible.length<CARD_COUNT){
      root.hidden=true;
      root.setAttribute('hidden','');
      grid.innerHTML='';
      return;
    }
    var picked=shuffle(eligible).slice(0, CARD_COUNT);
    grid.innerHTML=picked.map(cardHtml).join('');
    root.hidden=false;
    root.removeAttribute('hidden');
  }
  function fetchJson(urls){
    var i=0;
    function next(){
      if(i>=urls.length) return Promise.reject(new Error('no source'));
      var base=urls[i++];
      var u=base+(base.indexOf('?')>=0?'&':'?')+'t='+Date.now();
      return fetch(u,{cache:'no-store'}).then(function(r){
        if(!r.ok) throw new Error('HTTP '+r.status);
        return r.json();
      }).catch(function(){ return next(); });
    }
    return next();
  }
  function boot(){
    fetchJson(JSON_URLS).then(function(data){
      mount((data&&data.items)||[]);
    }).catch(function(err){
      console.warn('[arena-popular-home]', err);
      var root=document.getElementById(ROOT_ID);
      if(root){ root.hidden=true; root.setAttribute('hidden',''); }
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
