<div id="discounts-widget">
<style>
  #discounts-widget {
    background-color: #3c3c3c;
    color: #ffffff;
    font-family: 'Segoe UI', sans-serif;
  }
  #discounts-widget select, 
  #discounts-widget input[type="text"] {
    background-color: #1e1e1e;
    color: white;
    border: 2px solid #ffa500;
    border-radius: 8px;
  }
  #discounts-widget #catalog {
    background-color: #3a3a3a;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
  }
  #discounts-widget h3,
  #discounts-widget p {
    color: inherit;
  }
  #discounts-widget * {
    box-shadow: none !important;
  }
  #discounts-widget .pagination {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px auto;
    justify-content: center;
    max-width: 500px;
  }
  #discounts-widget #paginationTop {
    margin-top: 4px;
    margin-bottom: 16px;
  }
  #discounts-widget .pagination button {
    background-color: #1e1e1e;
    color: #ffffff;
    border: 2px solid #ffa500;
    border-radius: 12px;
    padding: 8px 12px;
    cursor: pointer;
    min-width: 40px;
  }
  #discounts-widget .pagination button:disabled,
  #discounts-widget .pagination a.pagination-link[aria-current="page"] {
    background-color: #444;
    cursor: not-allowed;
  }
  #discounts-widget .pagination a.pagination-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 40px;
    padding: 8px 12px;
    border-radius: 12px;
    background-color: #1e1e1e;
    color: #ffffff;
    border: 2px solid #ffa500;
    text-decoration: none;
    cursor: pointer;
    font: inherit;
    box-sizing: border-box;
  }
  #discounts-widget .pagination a.pagination-link:hover:not([aria-current="page"]) {
    background-color: #333;
  }
  #discounts-widget .pagination a.pagination-link[aria-current="page"] {
    background-color: #ffa500;
    pointer-events: none;
  }
  @media (max-width: 768px) {
    #discounts-widget #catalog {
      grid-template-columns: repeat(2, 1fr);
    }
    #discounts-widget .pagination {
      max-width: 320px;
    }
    #discounts-widget .pagination button {
      flex: 0 0 calc(20% - 8px);
      text-align: center;
    }
    #discounts-widget .card-buy-wrap .buy-now-button {
      display: block !important;
      text-align: center !important;
      border-radius: 12px !important;
      margin: 10px auto 0 auto !important;
      max-width: 100% !important;
    }
  }
  #discounts-widget .card-buy-wrap {
    padding: 0 12px 12px;
    display: flex;
    justify-content: center;
    width: 100%;
    box-sizing: border-box;
  }
  #discounts-widget a.buy-now-button,
  #discounts-widget button.buy-now-button {
    display: block;
    width: 100%;
    max-width: 100%;
    padding: 10px 12px;
    background-color: #76ff03;
    color: black;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    font-weight: bold;
    margin: 10px auto 0;
    box-sizing: border-box;
    font: inherit;
    line-height: 1.25;
    word-break: break-word;
  }
  #discounts-widget .buy-now-button.is-added {
    background-color: #ffa500;
    color: #000;
  }
  #discounts-widget .catalog-card {
    cursor: pointer;
  }
  #discounts-widget .card-media {
    position: relative;
  }
  #discounts-widget .card-cart-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(30, 30, 30, 0.9);
    border: 2px solid #76ff03;
    color: #76ff03;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    z-index: 2;
    box-sizing: border-box;
    transition: background 0.2s, transform 0.15s;
  }
  #discounts-widget .card-cart-btn:hover {
    background: #76ff03;
    color: #000;
    transform: scale(1.05);
  }
  #discounts-widget .card-cart-btn svg {
    display: block;
    width: 18px;
    height: 18px;
    fill: currentColor;
  }
  #discounts-widget .card-cart-btn.is-added {
    background: #ffa500;
    border-color: #ffa500;
    color: #000;
  }
  #lightbox-overlay .lightbox-buy-wrap {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    margin-top: 12px;
    width: 100%;
    box-sizing: border-box;
  }
  #lightbox-overlay .lightbox-buy-wrap .buy-now-button {
    width: 100%;
    max-width: 100%;
    margin: 0;
    box-sizing: border-box;
  }
  #discounts-widget .card-cover {
    cursor: pointer;
    width: 100%;
    height: 240px;
    object-fit: contain;
    background-color: #222;
  }
  #lightbox-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 9900;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 16px;
    box-sizing: border-box;
    overflow: hidden;
  }
  #lightbox-overlay.is-open {
    display: flex;
  }
  #lightbox-overlay .lightbox-slide {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    max-width: 100%;
    transition: transform 0.35s ease-out;
    will-change: transform;
  }
  #lightbox-overlay .lightbox-slide.dragging {
    transition: none;
  }
  #lightbox-overlay .lightbox-nav.hidden-by-swipe {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.2s, visibility 0.2s;
  }
  #lightbox-overlay .lightbox-image-wrap {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    max-width: 100%;
  }
  #lightbox-overlay .lightbox-image-wrap img {
    max-width: 90vw;
    max-height: 55vh;
    object-fit: contain;
    border-radius: 8px;
  }
  #lightbox-overlay .lightbox-info {
    background: #1e1e1e;
    color: #fff;
    padding: 16px;
    border-radius: 12px;
    margin-top: 16px;
    max-width: 90vw;
    width: 400px;
    text-align: left;
  }
  #lightbox-overlay .lightbox-info h3 { margin: 0 0 8px; font-size: 18px; }
  #lightbox-overlay .lightbox-info p { margin: 4px 0; font-size: 14px; }
  #lightbox-overlay .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    min-width: 48px;
    min-height: 48px;
    border-radius: 50%;
    border: 2px solid #ffa500;
    background: rgba(30,30,30,0.9);
    color: #fff;
    font-size: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  #lightbox-overlay .lightbox-nav:hover { background: #ffa500; color: #000; }
  #lightbox-overlay .lightbox-nav.prev { left: 12px; }
  #lightbox-overlay .lightbox-nav.next { right: 12px; }
  #lightbox-overlay .lightbox-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid #fff;
    background: rgba(0,0,0,0.5);
    color: #fff;
    font-size: 24px;
    cursor: pointer;
    line-height: 1;
    -webkit-tap-highlight-color: transparent;
  }
  #lightbox-overlay .lightbox-close:hover { background: #fff; color: #000; }
  #lightbox-overlay .lightbox-swipe-message {
    position: fixed;
    bottom: 24px;
    left: 16px;
    right: 16px;
    padding: 14px 18px;
    background: rgba(30,30,30,0.95);
    border: 2px solid #76ff03;
    border-radius: 16px;
    color: #fff;
    font-size: 15px;
    line-height: 1.4;
    text-align: center;
    z-index: 100000;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.35s ease, transform 0.35s ease;
    pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  #lightbox-overlay .lightbox-swipe-message.visible {
    opacity: 1;
    transform: translateY(0);
  }
  #lightbox-overlay .lightbox-swipe-message strong { color: #76ff03; }
  #lightbox-overlay .lightbox-random-prompt {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 100001;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }
  #lightbox-overlay .lightbox-random-prompt.visible {
    opacity: 1;
    visibility: visible;
  }
  #lightbox-overlay .lightbox-random-prompt-text {
    color: #fff;
    font-size: 20px;
    line-height: 1.45;
    text-align: center;
    margin: 0 0 28px 0;
    font-weight: 500;
    letter-spacing: 0.02em;
    max-width: 320px;
  }
  #lightbox-overlay .lightbox-random-prompt-buttons {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  #lightbox-overlay .lightbox-random-btn {
    min-width: 100px;
    padding: 14px 28px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    transition: transform 0.15s, box-shadow 0.2s;
  }
  #lightbox-overlay .lightbox-random-btn:hover { transform: scale(1.05); }
  #lightbox-overlay .lightbox-random-btn-yes {
    background: #76ff03;
    color: #000;
  }
  #lightbox-overlay .lightbox-random-btn-no {
    background: #e53935;
    color: #fff;
  }
  @media (max-width: 768px) {
    #lightbox-overlay .lightbox-nav {
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      font-size: 22px;
      z-index: 10;
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
    }
    #lightbox-overlay .lightbox-nav.prev {
      left: 8px;
      right: auto;
    }
    #lightbox-overlay .lightbox-nav.next {
      right: 8px;
      left: auto;
    }
    #lightbox-overlay .lightbox-info { width: 100%; padding: 12px; }
    #discounts-widget #paginationTop { display: none !important; }
  }

  /* ===== Product detail (gamerentps-like) ===== */
  #lightbox-overlay{
    background: color-mix(in srgb, #e8eef8 82%, transparent);
    backdrop-filter: blur(18px) saturate(1.25);
    -webkit-backdrop-filter: blur(18px) saturate(1.25);
    padding: 0;
    align-items: stretch;
    justify-content: stretch;
  }
  #lightbox-overlay .lightbox-slide{
    width: 100%;
    height: 100%;
    max-width: none;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    justify-content: flex-start;
  }
  #lightbox-overlay .lb-pd{
    width: min(1180px, 100%);
    margin: 0 auto;
    padding: 56px 18px 40px;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-areas: "media" "side" "recs";
    gap: 18px;
    color: #141820;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    align-items: start;
    box-sizing: border-box;
  }
  #lightbox-overlay .lb-media{grid-area:media; min-width:0}
  #lightbox-overlay .lb-side{grid-area:side; min-width:0}
  #lightbox-overlay .lb-recs{grid-area:recs; min-width:0}
  @media(min-width:900px){
    #lightbox-overlay .lb-pd{
      grid-template-columns: minmax(0,1.05fr) minmax(320px,400px);
      grid-template-areas: "media side" "recs recs";
      gap: 22px 28px;
      padding-top: 48px;
    }
    /* No sticky: otherwise the side panel covers recommendations when scrolling down. */
    #lightbox-overlay .lb-side{position:static}
  }
  #lightbox-overlay .lb-hero{
    position:relative;
    aspect-ratio:1/1;
    border-radius:22px;
    overflow:hidden;
    background:#0d0f18;
    border:1px solid rgba(37,99,235,.14);
    box-shadow:0 18px 40px rgba(15,23,42,.14);
  }
  #lightbox-overlay .lb-hero img{
    width:100%; height:100%; object-fit:cover; display:block;
    max-width:none; max-height:none; border-radius:0;
  }
  #lightbox-overlay .lb-shot-nav{
    position:absolute; top:50%; z-index:3; width:42px; height:42px; margin-top:-21px;
    border-radius:50%; border:1px solid rgba(255,255,255,.28);
    background:rgba(8,10,18,.62); color:#fff; font-size:26px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #lightbox-overlay .lb-shot-nav.prev{left:10px}
  #lightbox-overlay .lb-shot-nav.next{right:10px}
  #lightbox-overlay .lb-shot-nav[hidden]{display:none!important}
  #lightbox-overlay .lb-shot-count{
    position:absolute; right:10px; bottom:10px; z-index:3;
    padding:4px 9px; border-radius:999px; background:rgba(0,0,0,.55); color:#fff;
    font-size:12px; font-weight:800;
  }
  #lightbox-overlay .lb-shots{
    display:flex; gap:8px; overflow-x:auto; padding:10px 2px 2px;
    scrollbar-width:none;
  }
  #lightbox-overlay .lb-shots::-webkit-scrollbar{display:none}
  #lightbox-overlay .lb-shot{
    flex:0 0 72px; width:72px; height:72px; padding:0; border-radius:12px; overflow:hidden;
    border:2px solid transparent; background:#111; cursor:pointer;
  }
  #lightbox-overlay .lb-shot.is-on{border-color:rgba(37,99,235,.75)}
  #lightbox-overlay .lb-shot img{width:100%; height:100%; object-fit:cover; display:block}
  #lightbox-overlay .lb-side{
    padding:18px; border-radius:22px;
    border:1px solid rgba(255,255,255,.48);
    background:rgba(255,255,255,.55);
    box-shadow:0 12px 32px rgba(15,23,42,.08);
  }
  #lightbox-overlay .lb-side h3{
    margin:0 0 8px; font-size:clamp(1.2rem,2vw,1.55rem); font-weight:800; line-height:1.15; color:#141820;
  }
  #lightbox-overlay .lb-rating{color:#f5b301; font-weight:800; font-size:.9rem; margin-bottom:6px}
  #lightbox-overlay .lb-sub{margin:0 0 12px; color:#5a6478; font-size:.88rem; font-weight:650}
  #lightbox-overlay .lb-specs{
    display:flex; flex-direction:column; flex:0 0 auto;
    border-radius:14px; overflow:visible;
    border:1px solid rgba(20,24,32,.08); background:rgba(255,255,255,.45); margin-bottom:14px;
  }
  #lightbox-overlay .lb-spec{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    padding:9px 12px; border-bottom:1px solid rgba(20,24,32,.06); font-size:.82rem;
    flex:0 0 auto; min-height:auto;
  }
  #lightbox-overlay .lb-spec:last-child{border-bottom:none}
  #lightbox-overlay .lb-spec span:first-child{color:#6b7589; flex:0 0 auto}
  #lightbox-overlay .lb-spec span:last-child{
    font-weight:750; text-align:right; color:#141820; flex:1 1 auto; min-width:0;
    white-space:normal; overflow-wrap:anywhere;
  }
  #lightbox-overlay .lb-buy-stack{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:12px;
    position:relative;
    z-index:1;
    margin:2px 0 0;
  }
  #lightbox-overlay .lb-pricebox{
    margin:0;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:4px;
  }
  #lightbox-overlay .lb-discount{
    display:inline-flex; padding:4px 10px; border-radius:999px; background:#F15A22; color:#fff;
    font-size:.78rem; font-weight:800; letter-spacing:.02em;
  }
  #lightbox-overlay .lb-price{
    color:#047857; font-size:clamp(1.7rem, 3vw, 2.05rem); font-weight:900;
    margin:0; line-height:1.1; letter-spacing:.04em;
  }
  #lightbox-overlay .lb-price-old{
    color:#8b93a7; text-decoration:line-through; font-size:.92rem; margin:0; font-weight:650;
  }
  #lightbox-overlay .lb-buy-stack #lightbox-buy.buy-now-button,
  #lightbox-overlay #lightbox-buy.buy-now-button{
    width:100%;
    min-height:52px;
    margin:0;
    padding:14px 22px;
    border:none;
    border-radius:16px;
    cursor:pointer;
    background:linear-gradient(135deg,#22d3ee,#3d8bfd 42%,#6366f1);
    color:#fff;
    font-size:1.05rem;
    font-weight:850;
    letter-spacing:.04em;
    box-shadow:0 10px 24px rgba(37,99,235,.28);
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  #lightbox-overlay #lightbox-buy.buy-now-button:hover{
    filter:brightness(1.05);
    box-shadow:0 12px 28px rgba(37,99,235,.34);
  }
  #lightbox-overlay #lightbox-buy.buy-now-button:active{transform:translateY(1px)}
  #lightbox-overlay .lightbox-buy-wrap{display:none!important}
  #lightbox-overlay .lb-note{margin:0; color:#6b7589; font-size:.78rem; font-weight:650}
  #lightbox-overlay .lb-desc{
    padding:16px 18px; border-radius:18px;
    border:1px solid rgba(255,255,255,.48); background:rgba(255,255,255,.5);
    position:relative;
    z-index:0;
  }
  #lightbox-overlay .lb-desc h4{margin:0 0 10px; color:#5a6478; font-size:1rem}
  #lightbox-overlay .lb-desc #lightbox-desc{
    color:#3d4658; font-size:.95rem; line-height:1.65; white-space:pre-wrap;
  }
  #lightbox-overlay .lb-desc-more{
    display:none; margin-top:10px; padding:0; border:0; background:none;
    color:#2563eb; font-size:.86rem; font-weight:800; cursor:pointer;
  }
  #lightbox-overlay .lb-desc-more.is-visible{display:inline-flex}
  #lightbox-overlay .lightbox-info{display:none!important}
  #lightbox-overlay .lightbox-image-wrap{display:none!important}
  #lightbox-overlay .lightbox-close{
    top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right));
    z-index:5; border:1px solid rgba(20,24,32,.12); background:rgba(255,255,255,.85); color:#141820;
  }
  #lightbox-overlay .lightbox-nav{
    border:1px solid rgba(20,24,32,.12); background:rgba(255,255,255,.88); color:#141820;
  }
  #lightbox-overlay .lightbox-nav:hover{background:#F15A22; color:#fff; border-color:transparent}
  @media(max-width:899px){
    #lightbox-overlay{
      align-items:stretch;
      padding:0;
    }
    #lightbox-overlay .lightbox-slide{
      display:block;
      height:100%;
      overflow:auto;
      -webkit-overflow-scrolling:touch;
    }
    #lightbox-overlay .lb-pd{
      width:100%;
      max-width:100%;
      padding: calc(12px + env(safe-area-inset-top, 0px)) 14px calc(28px + env(safe-area-inset-bottom, 0px));
      gap:14px;
    }
    #lightbox-overlay .lb-hero{
      aspect-ratio:1/1;
      max-width:100%;
      margin:0 auto;
      border-radius:18px;
    }
    #lightbox-overlay .lb-shots{padding-top:8px}
    #lightbox-overlay .lb-shot{flex:0 0 64px; width:64px; height:64px; border-radius:10px}
    #lightbox-overlay .lb-side{
      position:static !important;
      max-height:none !important;
      overflow:visible !important;
      padding:16px;
      border-radius:18px;
    }
    #lightbox-overlay .lb-side h3{font-size:1.2rem}
    #lightbox-overlay .lb-price{font-size:1.55rem; letter-spacing:.03em}
    #lightbox-overlay .lightbox-nav{display:none}
    #lightbox-overlay .lightbox-close{
      width:42px; height:42px; font-size:28px;
    }
  }

  /* Light catalog shell closer to gamerentps */
  #discounts-widget{
    --wtb-text:#141820;
    --wtb-sub:#5a6478;
    --wtb-accent:#2563eb;
    --wtb-line:rgba(37,99,235,.16);
    --wtb-glass:rgba(255,255,255,.72);
    background:
      radial-gradient(ellipse 90% 55% at 8% -8%, rgba(147,197,253,.45), transparent 58%),
      radial-gradient(ellipse 70% 45% at 92% 0%, rgba(191,219,254,.35), transparent 52%),
      #e8eef8 !important;
    color:var(--wtb-text) !important;
    border-radius:0;
    padding:8px 12px 28px;
    box-sizing:border-box;
  }
  #discounts-widget #counter,
  #discounts-widget #pageIndicator{color:var(--wtb-text) !important}
  #discounts-widget #pageIndicator{color:var(--wtb-accent) !important}
  #discounts-widget select,
  #discounts-widget input[type="text"]{
    background:#fff !important; color:var(--wtb-text) !important; border:1px solid var(--wtb-line) !important;
  }
  #discounts-widget #catalog{
    background:transparent !important;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)) !important;
    gap:14px !important;
    align-items:stretch;
  }
  #discounts-widget .pagination button,
  #discounts-widget .pagination a.pagination-link{
    background:#fff !important; color:var(--wtb-text) !important; border:1px solid var(--wtb-line) !important;
  }
  #discounts-widget .filters-bar button{
    background:#fff !important; color:var(--wtb-text) !important;
    border:1px solid var(--wtb-line) !important; border-radius:10px !important;
  }

  /* gamerentps-like cards */
  #discounts-widget .catalog-card{
    background:var(--wtb-glass) !important;
    border:1px solid rgba(255,255,255,.55) !important;
    border-radius:16px !important;
    color:var(--wtb-text) !important;
    box-shadow:0 10px 28px rgba(15,23,42,.08) !important;
    display:flex !important;

<script>
let allCards = [];
let currentPage = 1;
const CARDS_PER_PAGE_DESKTOP = 100;
const CARDS_PER_PAGE_MOBILE = 44;
function getCardsPerPage() {
  return window.innerWidth <= 768 ? CARDS_PER_PAGE_MOBILE : CARDS_PER_PAGE_DESKTOP;
}
let currentPageCards = [];
let currentFilteredCards = [];
let lightboxIndex = 0;
let lightboxSwipesThisSession = 0;
let lightboxRandomPromptShown = false;
let lightboxRandomMode = false;
let touchStartY = 0, touchStartX = 0;
const SWIPE_THRESHOLD = 60;
const SWIPE_NAV_HIDE_THRESHOLD = 20;
const PRELOAD_RANDOM_COUNT = 10;
const SWIPE_MILESTONES = [10, 25, 35, 45, 60, 70, 90, 120, 160, 180];
const SWIPE_MESSAGE_DURATION = 4500;
let swipeMessageTimer = null;

/* Global sale window (MSK). Deadline is detected from cards' sale_until. */
let SALE_DEADLINE_TS = new Date("2026-11-22T00:00:00+03:00").getTime();
let SALE_START_TS = SALE_DEADLINE_TS - 21 * 24 * 3600 * 1000;
let __saleBarTimer = null;
let __lbCdTimer = null;
let __saleDeadlineLabel = "";

function parseSaleUntilToTs(raw){
  const s = String(raw || '').trim();
  let m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if (!m) m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (!m) return null;
  let d, mo, y;
  if (m[1].length === 4) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else { d = +m[1]; mo = +m[2]; y = +m[3]; }
  if (!y || !mo || !d) return null;
  // "до DD.MM.YYYY" = inclusive end of that day → next midnight MSK
  const iso = y + '-' + String(mo).padStart(2,'0') + '-' + String(d).padStart(2,'0') + 'T00:00:00+03:00';
  const startDay = new Date(iso).getTime();
  if (!Number.isFinite(startDay)) return null;
  return startDay + 24 * 3600 * 1000;
}
function detectSaleDeadlineFromCards(cards){
  const pool = (cards || []).map(c => String(c && c.sale_until || '').trim()).filter(Boolean);
  if (!pool.length) return null;
  const sampleN = Math.min(5, pool.length);
  const picks = [];
  const used = new Set();
  while (picks.length < sampleN) {
    const i = Math.floor(Math.random() * pool.length);
    if (used.has(i)) continue;
    used.add(i);
    picks.push(pool[i]);
  }
  const counts = Object.create(null);
  for (const d of picks) counts[d] = (counts[d] || 0) + 1;
  let best = null, bestN = 0;
  for (const [d, n] of Object.entries(counts)) {
    if (n > bestN) { best = d; bestN = n; }
  }
  // If 5 random cards share one date (or majority ≥3 / all when fewer), use it
  const need = sampleN >= 5 ? 5 : sampleN;
  if (bestN >= need || (sampleN >= 3 && bestN >= 3) || (sampleN < 3 && bestN === sampleN)) {
    return best;
  }
  // Fallback: mode of whole catalog
  const all = Object.create(null);
  for (const d of pool) all[d] = (all[d] || 0) + 1;
  best = null; bestN = 0;
  for (const [d, n] of Object.entries(all)) {
    if (n > bestN) { best = d; bestN = n; }
  }
  return best;
}
function applySaleDeadline(dateStr){
  const ts = parseSaleUntilToTs(dateStr);
  if (!ts) return false;
  SALE_DEADLINE_TS = ts;
  // Progress starts 21 days before deadline (or now if closer)
  const span = 21 * 24 * 3600 * 1000;
  SALE_START_TS = Math.min(Date.now(), SALE_DEADLINE_TS - span);
  if (SALE_START_TS >= SALE_DEADLINE_TS) SALE_START_TS = SALE_DEADLINE_TS - span;
  __saleDeadlineLabel = dateStr;
  const title = document.querySelector('#wtb-sale-bar .title');
  if (title) title.textContent = 'Время до завершения скидок (до ' + dateStr + ')';
  return true;
}

function pad2Sale(n){ return n < 10 ? "0" + n : String(n); }
function formatSaleDHMS(ms){
  const d = Math.floor(ms / 86400000);
  const h = Math.floor((ms % 86400000) / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  if (d > 0) return pad2Sale(d) + "д " + pad2Sale(h) + "ч " + pad2Sale(m) + "м " + pad2Sale(s) + "с";
  if (h > 0) return pad2Sale(h) + "ч " + pad2Sale(m) + "м " + pad2Sale(s) + "с";
  return pad2Sale(m) + "м " + pad2Sale(s) + "с";
}
function saleParts(ms){
  const left = Math.max(0, ms);
  return {
    d: Math.floor(left / 86400000),
    h: Math.floor((left % 86400000) / 3600000),
    m: Math.floor((left % 3600000) / 60000),
    s: Math.floor((left % 60000) / 1000)
  };
}
function saleProgressPct(now){
  const total = Math.max(SALE_DEADLINE_TS - SALE_START_TS, 1);
  const left = SALE_DEADLINE_TS - now;
  if (left <= 0) return 0;
  if (now <= SALE_START_TS) return 100;
  return Math.min(100, Math.max(0, (left / total) * 100));
}
function tickSaleBar(){
  const fill = document.getElementById("wtb-sale-fill");
  const remain = document.getElementById("wtb-sale-remaining");
  const expired = document.getElementById("wtb-sale-expired");
  const track = fill && fill.parentElement;
  if (!fill || !remain) return;
  const now = Date.now();
  const left = SALE_DEADLINE_TS - now;
  const pct = saleProgressPct(now);
  fill.style.width = pct.toFixed(2) + "%";
  if (track) track.setAttribute("aria-valuenow", String(Math.round(pct)));
  if (left <= 0){
    remain.textContent = "00м 00с";
    if (expired) expired.style.display = "block";
    if (__saleBarTimer){ clearInterval(__saleBarTimer); __saleBarTimer = null; }
    return;
  }
  if (expired) expired.style.display = "none";
  remain.textContent = formatSaleDHMS(left);
}
function startSaleBar(){
  tickSaleBar();
  if (__saleBarTimer) clearInterval(__saleBarTimer);
  __saleBarTimer = setInterval(tickSaleBar, 1000);
}
function renderLightboxCountdownGrid(){

  const p = saleParts(SALE_DEADLINE_TS - Date.now());

}

const ruToEnLayout = {
  'й':'q','ц':'w','у':'e','к':'r','е':'t','н':'y','г':'u','ш':'i','щ':'o','з':'p','х':'[','ъ':']','ё':'`',
  'ф':'a','ы':'s','в':'d','а':'f','п':'g','р':'h','о':'j','л':'k','д':'l','ж':';','э':"'",
  'я':'z','ч':'x','с':'c','м':'v','и':'b','т':'n','ь':'m','б':',','ю':'.'
};
function layoutRuToEn(str) {

}

function getProductUidFromUrl(url) {

  return m ? m[1] : null;
}

  if (/tproduct\//i.test(raw)) {
    return raw.split("#")[0].split("?")[0];
  }
  return "";
}

function getCatalogShareUrl(item) {
  const uid = getGameId(item);

  return location.origin + path + "#game=" + uid;

/** Процент скидки по ценам «было» / «сейчас» (после normalize всегда ≥ 1). */
function calcDiscountPercent(item) {
  const oldP = Number(item && item.price_old);
  const newP = Number(item && item.price);
  if (oldP > 0 && newP >= 0 && newP < oldP) {
    return Math.max(1, Math.round((1 - newP / oldP) * 100));
  }
  const fromData = Number(item && item.discount);
  if (isFinite(fromData) && fromData >= 1) return Math.round(fromData);
  return 1;
}

/** Если старая цена ≤ новой (или нет «было») — завышаем «было», чтобы скидка выглядела реальной. */
function inflateOldPrice(newP, oldP, hintPct) {
  const price = Number(newP);
  if (!(price > 0)) return Math.max(0, Number(oldP) || 0);
  let old = Number(oldP);
  let pct = Number(hintPct);
  if (!(isFinite(pct) && pct >= 5 && pct <= 70)) pct = 15;
  if (!(old > price)) {
    old = Math.round(price / (1 - pct / 100));
  }
  // Красивое округление вверх к 10/50/100 в зависимости от суммы
  const step = old >= 5000 ? 100 : old >= 1000 ? 50 : 10;
  old = Math.ceil(old / step) * step;
  while (old <= price || Math.round((1 - price / old) * 100) < 1) {
    old += step;
  }
  return old;
}

function normalizeCardPrices(card) {
  const c = Object.assign({}, card);
  const newP = Number(c.price);
  if (newP > 0) {
    c.price_old = inflateOldPrice(newP, c.price_old, c.discount);
    c.discount = Math.max(1, Math.round((1 - newP / Number(c.price_old)) * 100));
  } else {
    c.discount = calcDiscountPercent(c);
  }
  return c;
}

function getGameFromHash() {
  const m = location.hash.match(/[#&]game=(\d+)/i);
  return m ? m[1] : null;

function getPageFromHash() {
  const m = location.hash.match(/[#&]page=(\d+)/i) || location.hash.match(/[#&]p=(\d+)/i);
  return m ? parseInt(m[1], 10) : null;
}

function buildHash(params) {
  return Object.keys(params).filter(k => params[k] != null && params[k] !== "").map(k => k + "=" + encodeURIComponent(params[k])).join("&");
}

function updateHashForPage(page, gameUid) {
  const parts = {};
  if (gameUid) parts.game = gameUid;
  else if (page > 1) parts.page = page;
  const hash = buildHash(parts);
  const target = hash ? "#" + hash : "";
  if (location.hash !== target) {
    try { history.replaceState(null, "", location.pathname + location.search + target); } catch (e) { location.hash = hash || ""; }
  }
}

    if (isLightboxOpen() && isTildaCheckoutVisible()) closeLightbox();
  };

  const attachObserver = function(root) {
    if (!root || root.__discountsCartObs) return;
    const obs = new MutationObserver(checkCheckout);
    obs.observe(root, { attributes: true, childList: true, subtree: true, attributeFilter: ["style", "class"] });
    root.__discountsCartObs = obs;
  };

  const findAndObserve = function() {
    document.querySelectorAll(".t706").forEach(attachObserver);

function openLightboxByUid(uid, updateHistory) {
  const item = findCardByUid(uid);
  if (!item) return false;
  if (isStalkerTitle(item.title)) {
    if (updateHistory !== false) updateHashForPage(currentPage > 1 ? currentPage : null, null);
    return false;
  }
  lightboxStandalone = false;
  const idx = currentFilteredCards.findIndex(c => getProductUidFromUrl(c.url) === String(uid));
  if (idx >= 0) {
    const perPage = getCardsPerPage();
    const targetPage = Math.floor(idx / perPage) + 1;
    if (targetPage !== currentPage) {
      currentPage = targetPage;
      filterAndRender();
    }
    const pageIdx = currentPageCards.findIndex(c => getProductUidFromUrl(c.url) === String(uid));
    openLightbox(pageIdx >= 0 ? pageIdx : 0, updateHistory);
    return true;
  }
  lightboxStandalone = true;
  currentPageCards = [item];
  openLightbox(0, updateHistory);
  return true;
}

function applyHashRouting() {
  const gameUid = getGameFromHash();
  if (gameUid) {
    if (allCards.length) openLightboxByUid(gameUid, false);

  const overlay = document.getElementById("lightbox-overlay");
  if (overlay && overlay.classList.contains("is-open")) closeLightbox();
  const p = getPageFromHash();
  if (p != null && p >= 1 && p !== currentPage) {
    currentPage = p;
    filterAndRender();
  }
}

async function loadCards() {
  const res = await fetch("https://raw.githubusercontent.com/chekoli911/game-discountsArenaSALE/main/discounts_full_with_platform_final_with_url_FIXED_v3.json");
  const data = await res.json();
  allCards = data.map(normalizeCardPrices);
  const detected = detectSaleDeadlineFromCards(allCards);
  if (detected) applySaleDeadline(detected);
  startSaleBar();
  filterAndRender();
  const gameUid = getGameFromHash();
  if (gameUid) {
    openLightboxByUid(gameUid, false);
    return;
  }
  const pageFromHash = getPageFromHash();
  if (pageFromHash != null && pageFromHash >= 1) currentPage = pageFromHash;
  filterAndRender();
  if (pageFromHash != null) setTimeout(() => scrollToPageTop(), 100);
}

function filterAndRender() {
  const query = document.getElementById("searchInput").value.toLowerCase();
  const queryEn = layoutRuToEn(query);
  const minPrice = parseInt(document.getElementById("minPrice").value);
  const maxPrice = parseInt(document.getElementById("maxPrice").value);
  const platformValue = document.getElementById("platformFilter").value;
  const sortValue = document.getElementById("sortSelect").value;

  const catalogPool = getCatalogCards(allCards);
  let filtered = catalogPool.filter(card => {
    const matchPlatform = platformValue === "all" || card.platform.toLowerCase().includes(platformValue.toLowerCase());
    const title = card.title.toLowerCase();
    const matchSearch = !query || title.includes(query) || (queryEn !== query && title.includes(queryEn));
    return (
      matchSearch &&
      card.price >= minPrice &&
      card.price <= maxPrice &&
      matchPlatform
    );
  });

  if (sortValue === "price_asc") {
    filtered.sort((a, b) => a.price - b.price);
  } else if (sortValue === "price_desc") {
    filtered.sort((a, b) => b.price - a.price);
  } else if (sortValue === "alpha_asc") {
    filtered.sort((a, b) => a.title.localeCompare(b.title, 'ru', { numeric: true, sensitivity: 'base' }));
  } else if (sortValue === "alpha_desc") {
    filtered.sort((a, b) => b.title.localeCompare(a.title, 'ru', { numeric: true, sensitivity: 'base' }));
  } else if (sortValue === "discount_desc") {
    filtered.sort((a, b) => calcDiscountPercent(b) - calcDiscountPercent(a));
  }

  currentFilteredCards = filtered;
  const totalPages = Math.ceil(filtered.length / getCardsPerPage()) || 1;
  currentPage = Math.max(1, Math.min(currentPage, totalPages));
  if (!getGameFromHash()) updateHashForPage(currentPage, null);

  renderCards(filtered);
  updatePagination(filtered);
  document.getElementById("counter").innerText = `Найдено игр: ${filtered.length} из ${catalogPool.length}`;
  document.getElementById("pageIndicator").innerText = totalPages > 0 ? `Страница ${currentPage} из ${totalPages}` : "";
}

function renderCards(cards) {
  const catalog = document.getElementById("catalog");
  catalog.innerHTML = "";
  const perPage = getCardsPerPage();
  const startIndex = (currentPage - 1) * perPage;
  const endIndex = startIndex + perPage;
  const paginatedCards = cards.slice(startIndex, endIndex);
  currentPageCards = paginatedCards;

  paginatedCards.forEach((item, index) => {
    const card = document.createElement("div");
    card.className = "catalog-card";
    const safeTitle = String(item.title || "").replace(/"/g, "&quot;");
    const disc = calcDiscountPercent(item);
    card.innerHTML = `
      <div class="card-media">
        <img class="card-cover" src="${item.image}" alt="${safeTitle}" data-index="${index}" loading="lazy" decoding="async">
        ${disc ? `<span class="card-ribbon">−${disc}%</span>` : ""}
        ${item.url ? `<button type="button" class="card-cart-btn" aria-label="Добавить в корзину">${CART_ICON_SVG}</button>` : ""}
      </div>
      <div class="card-body">
        <h3 class="card-title">${item.title}</h3>
        <p class="card-meta">${item.platform || item.platforms || "PS"} · покупка</p>
        <div class="card-prices">
          <span class="card-price-old">${item.price_old}₽</span>
          <span class="card-price">${item.price}₽</span>
        </div>
      </div>
      <div class="card-buy-wrap">
        ${item.url ? `<button type="button" class="buy-now-button">Купить</button>` : ""}
      </div>
    `;
    card.addEventListener("click", (e) => {
      if (e.target.closest(".buy-now-button, .card-cart-btn")) return;
      openLightbox(index, true);
    });

function normTitle(s){
  return String(s||'').toLowerCase().replace(/[™®©]/g,'').replace(/[^a-z0-9а-яё]+/gi,' ').replace(/\s+/g,' ').trim();
}
function stripRentCopy(text){
  let t = String(text||'');
  t = t.replace(/для аренды[\s\S]*$/i,'').replace(/аренда[\s\S]{0,40}/gi,'');
  t = t.replace(/\bп2\b|\bп3\b|p2|p3/gi,'');
  t = t.replace(/@ArenaPSGMadmin/gi,'').replace(/ССЫЛКА/g,'');
  return t.replace(/\n{3,}/g,'\n\n').trim();
}
function starsText(r){

async function fetchJsonFirst(urls){
  let last;
  for (const u of urls){
    try{
      const r = await fetch(u + (u.includes('?')?'&':'?') + 't=' + Date.now(), {cache:'no-store'});
      if (!r.ok) throw new Error('HTTP '+r.status);
      return await r.json();
    }catch(e){ last=e; }
  }
  throw last || new Error('fetch failed');
}
async function getSearchIndex(){
  if (__searchIndex) return __searchIndex;
  __searchIndex = await fetchJsonFirst([
    'https://raw.githubusercontent.com/chekoli911/game-discountsArenaSALE/refs/heads/main/rent-catalog/rent_catalog_search.json',
    'https://raw.githubusercontent.com/chekoli911/game-discountsArenaSALE/main/rent-catalog/rent_catalog_search.json',
    'https://cdn.jsdelivr.net/gh/chekoli911/game-discountsArenaSALE@main/rent-catalog/rent_catalog_search.json'
  ]);
  return __searchIndex;
}
async function getChunk(n){
  const key = String(n);
  if (__chunkCache[key]) return __chunkCache[key];
  const name = 'rent_catalog_chunk_' + String(n).padStart(3,'0') + '.json';
  const doc = await fetchJsonFirst([
    'https://raw.githubusercontent.com/chekoli911/game-discountsArenaSALE/refs/heads/main/rent-catalog/' + name,
    'https://raw.githubusercontent.com/chekoli911/game-discountsArenaSALE/main/rent-catalog/' + name,
    'https://cdn.jsdelivr.net/gh/chekoli911/game-discountsArenaSALE@main/rent-catalog/' + name
  ]);
  __chunkCache[key] = doc;
  return doc;
}
function setupLightboxDescExpand(descEl, moreBtn){

      if (!overflows) {
        descEl.classList.remove('is-clamped');

async function resolveDescription(item){
  const key = item.url || item.title;
  if (__descCache[key]) return __descCache[key];
  if (item.description) {
    __descCache[key] = stripRentCopy(item.description);
    return __descCache[key];
  }
  try{
    const idx = await getSearchIndex();
    const nt = normTitle(item.title);
    let best = null;
    for (const row of idx){
      const rt = normTitle(row.title);
      if (!rt || !nt) continue;
      if (rt === nt || rt.includes(nt) || nt.includes(rt)) { best = row; break; }
    }
    if (!best) {
      __descCache[key] = '';
      return '';
    }
    const chunk = await getChunk(best.chunk);
    const items = (chunk && chunk.items) || [];
    const hit = items.find(it => (it.slug === best.slug) || normTitle(it.title) === normTitle(best.title)) || items.find(it => normTitle(it.title).includes(nt));
    const desc = stripRentCopy((hit && (hit.description || hit.descr || hit.text)) || '');
    __descCache[key] = desc;
    return desc;
  }catch(e){
    __descCache[key] = '';
    return '';
  }
}

function cardKey(item){
  return String(getProductUidFromUrl(item && item.url) || item && item.url || item && item.title || '');

function shuffleInPlace(arr){
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function pickRecommendations(current, count){
  count = count || 16;
  const exclude = cardKey(current);
  const pool = getCatalogCards(allCards).filter(it => cardKey(it) && cardKey(it) !== exclude);
  const genre = String(current && current.genre || '').toLowerCase().trim();
  const platform = String(current && (current.platform || current.platforms) || '').toLowerCase().trim();
  const sameGenre = [];
  const samePlatform = [];
  const rest = [];
  for (const it of pool) {
    const g = String(it.genre || '').toLowerCase().trim();
    const p = String(it.platform || it.platforms || '').toLowerCase().trim();
    if (genre && g && (g === genre || g.includes(genre) || genre.includes(g))) sameGenre.push(it);
    else if (platform && p && (p === platform || p.includes(platform) || platform.includes(p))) samePlatform.push(it);
    else rest.push(it);
  }
  shuffleInPlace(sameGenre);
  shuffleInPlace(samePlatform);
  shuffleInPlace(rest);
  const picked = [];
  const used = new Set();
  const take = (list) => {
    for (const it of list) {
      if (picked.length >= count) break;
      const k = cardKey(it);
      if (!k || used.has(k)) continue;
      used.add(k);
      picked.push(it);
    }
  };
  take(sameGenre);
  take(samePlatform);
  take(rest);
  return picked;
}

function preloadRandomCards(count) {
  if (!currentFilteredCards.length) return;
  const total = currentFilteredCards.length;
  const indices = new Set();
  while (indices.size < Math.min(count, total)) {
    indices.add(Math.floor(Math.random() * total));
  }
  indices.forEach(idx => {
    const item = currentFilteredCards[idx];
    if (item && item.image) {
      const img = new Image();

  });

function canGoPrev() {
  return lightboxIndex > 0 || (lightboxIndex === 0 && currentPage > 1);
}
function canGoNext() {
  if (lightboxRandomMode && currentFilteredCards.length > 0) return true;
  const perPage = getCardsPerPage();
  return lightboxIndex < currentPageCards.length - 1 ||
    (lightboxIndex === currentPageCards.length - 1 && currentPage * perPage < currentFilteredCards.length);
}
function applyPrevCard() {
  lightboxSwipesThisSession++;
  if (lightboxSwipesThisSession === 3 && !lightboxRandomPromptShown) {
    showRandomOrderPrompt();
    lightboxRandomPromptShown = true;
    return;
  }
  if (lightboxIndex > 0) {
    lightboxIndex--;
    setLightboxContent(lightboxIndex);
    return;
  }
  if (lightboxIndex === 0 && currentPage > 1) {
    currentPage--;
    filterAndRender();
    lightboxIndex = currentPageCards.length - 1;
    setLightboxContent(lightboxIndex);
  }
}
function applyNextCard() {
  lightboxSwipesThisSession++;
  if (lightboxSwipesThisSession === 3 && !lightboxRandomPromptShown) {
    showRandomOrderPrompt();
    lightboxRandomPromptShown = true;
    return;
  }
  const prevCount = getSwipedToday();
  const newCount = prevCount + 1;
  setSwipedToday(newCount);
  if (SWIPE_MILESTONES.includes(newCount)) showSwipeMilestoneMessage(newCount);

  const perPage = getCardsPerPage();
  if (lightboxRandomMode && currentFilteredCards.length > 0) {
    const randomIndex = Math.floor(Math.random() * currentFilteredCards.length);
    currentPage = Math.floor(randomIndex / perPage) + 1;
    filterAndRender();
    lightboxIndex = randomIndex % perPage;
    setLightboxContent(lightboxIndex);
    preloadRandomCards(PRELOAD_RANDOM_COUNT);
    return;
  }
  if (lightboxIndex < currentPageCards.length - 1) {
    lightboxIndex++;
    setLightboxContent(lightboxIndex);
    return;
  }
  if (lightboxIndex === currentPageCards.length - 1 && currentPage * perPage < currentFilteredCards.length) {
    currentPage++;
    filterAndRender();
    lightboxIndex = 0;
    setLightboxContent(0);
  }
}

function lightboxSwipeTo(direction) {
  if (direction === "next" && !canGoNext()) return;
  if (direction === "prev" && !canGoPrev()) return;
  const { slide } = getLightboxEls();
  slide.classList.remove("dragging");
  slide.style.transition = "transform 0.35s ease-out";
  const exitY = direction === "next" ? "-100vh" : "100vh";
  slide.style.transform = `translateY(${exitY})`;
  const onExitEnd = () => {
    slide.removeEventListener("transitionend", onExitEnd);
    if (direction === "next") applyNextCard(); else applyPrevCard();
    const enterFrom = direction === "next" ? "100vh" : "-100vh";
    slide.style.transition = "none";
    slide.style.transform = `translateY(${enterFrom})`;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        slide.style.transition = "transform 0.35s ease-out";
        slide.style.transform = "translateY(0)";
      });
    });
    const onEnterEnd = () => {
      slide.removeEventListener("transitionend", onEnterEnd);
      slide.style.transition = "";
      slide.style.transform = "";
    };
    slide.addEventListener("transitionend", onEnterEnd);
  };
  slide.addEventListener("transitionend", onExitEnd);
}

function getVisiblePages(totalPages, current) {
  if (totalPages <= 7) return Array.from({ length: totalPages }, (_, i) => i + 1);
  const pages = new Set([1, totalPages]);
  const half = 2;
  for (let i = Math.max(1, current - half); i <= Math.min(totalPages, current + half); i++) pages.add(i);
  const sorted = [...pages].sort((a, b) => a - b);
  const result = [];
  for (let i = 0; i < sorted.length; i++) {
    if (i > 0 && sorted[i] - sorted[i - 1] > 1) result.push("…");
    result.push(sorted[i]);
  }
  return result;
}

function fillPaginationContainer(container, totalPages) {
  container.innerHTML = "";
  const go = (action) => {
    action();
    filterAndRender();
    scrollToPageTop();
  };
  const prevButton = document.createElement("button");
  prevButton.innerText = "←";
  prevButton.title = "Предыдущая страница";
  prevButton.disabled = currentPage === 1;
  prevButton.onclick = () => { if (currentPage > 1) go(() => currentPage--); };
  container.appendChild(prevButton);

  const visible = getVisiblePages(totalPages, currentPage);
  for (const item of visible) {
    if (item === "…") {
      const span = document.createElement("span");
      span.innerText = " … ";
      span.style.cssText = "color: #888; padding: 0 4px; user-select: none;";
      container.appendChild(span);
    } else {
      const pageLink = document.createElement("a");
      pageLink.href = "#page=" + item;
      pageLink.className = "pagination-link";
      pageLink.innerText = item;
      pageLink.setAttribute("aria-current", currentPage === item ? "page" : "false");
      pageLink.onclick = (e) => { e.preventDefault(); go(() => currentPage = item); };
      container.appendChild(pageLink);
    }
  }

  const nextButton = document.createElement("button");
  nextButton.innerText = "→";
  nextButton.title = "Следующая страница";
  nextButton.disabled = currentPage === totalPages;
  nextButton.onclick = () => { if (currentPage < totalPages) go(() => currentPage++); };
  container.appendChild(nextButton);
}

function updatePagination(cards) {
  const totalPages = Math.ceil(cards.length / getCardsPerPage());
  if (totalPages <= 0) return;
  fillPaginationContainer(document.getElementById("paginationTop"), totalPages);
  fillPaginationContainer(document.getElementById("pagination"), totalPages);
}

function resetFilters() {
  document.getElementById("searchInput").value = "";
  document.getElementById("minPrice").value = "0";
  document.getElementById("maxPrice").value = "999999";
  document.getElementById("platformFilter").value = "all";
  document.getElementById("sortSelect").value = "none";
  currentPage = 1;
  filterAndRender();
}

function bootWhattobuysale() {
  if (window.__wtbBooted) return;
  window.__wtbBooted = true;
  setupLightboxCloseOnTildaCart();
  loadCards();
  document.getElementById("searchInput").addEventListener("input", filterAndRender);
  document.getElementById("minPrice").addEventListener("change", filterAndRender);
  document.getElementById("maxPrice").addEventListener("change", filterAndRender);
  document.getElementById("platformFilter").addEventListener("change", filterAndRender);
  document.getElementById("sortSelect").addEventListener("change", filterAndRender);
  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(filterAndRender, 150);
  });
  window.addEventListener("hashchange", applyHashRouting);

  const overlay = document.getElementById("lightbox-overlay");
  const slideEl = overlay.querySelector(".lightbox-slide");
  const prevBtn = overlay.querySelector(".lightbox-nav.prev");
  const nextBtn = overlay.querySelector(".lightbox-nav.next");
  overlay.querySelector(".lightbox-close").addEventListener("click", closeLightbox);
  prevBtn.addEventListener("click", lightboxPrev);
  nextBtn.addEventListener("click", lightboxNext);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeLightbox(); });
  document.getElementById("lightbox-random-yes").addEventListener("click", () => {
    lightboxRandomMode = true;
    hideRandomOrderPrompt();
    preloadRandomCards(PRELOAD_RANDOM_COUNT);
  });
  document.getElementById("lightbox-random-no").addEventListener("click", () => {
    lightboxRandomMode = false;
    hideRandomOrderPrompt();
  });

  overlay.addEventListener("touchstart", (e) => {
    if (!overlay.classList.contains("is-open") || !e.touches.length) return;
    touchStartY = e.touches[0].clientY;
    touchStartX = e.touches[0].clientX;
    slideEl.classList.add("dragging");
    slideEl.style.transition = "none";
  }, { passive: true });
  overlay.addEventListener("touchmove", (e) => {
    if (!overlay.classList.contains("is-open") || !e.touches.length) return;
    const deltaY = e.touches[0].clientY - touchStartY;
    const deltaX = e.touches[0].clientX - touchStartX;
    if (Math.abs(deltaY) > SWIPE_NAV_HIDE_THRESHOLD) {
      prevBtn.classList.add("hidden-by-swipe");
      nextBtn.classList.add("hidden-by-swipe");
    }
    slideEl.style.transform = `translateY(${deltaY}px)`;
    if (Math.abs(deltaY) > Math.abs(deltaX) && Math.abs(deltaY) > 8) e.preventDefault();
  }, { passive: false });
  overlay.addEventListener("touchend", (e) => {
    if (!overlay.classList.contains("is-open")) return;
    const deltaY = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(deltaY) > SWIPE_THRESHOLD) {
      lightboxSwipeTo(deltaY < 0 ? "next" : "prev");
    } else {
      slideEl.classList.remove("dragging");
      slideEl.style.transition = "transform 0.35s ease-out";
      slideEl.style.transform = "translateY(0)";
      const onBack = () => {
        slideEl.removeEventListener("transitionend", onBack);
        slideEl.style.transition = "";
        slideEl.style.transform = "";
      };
      slideEl.addEventListener("transitionend", onBack);
    }
  }, { passive: true });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeLightbox();
    if (overlay.classList.contains("is-open") && !["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)) {
      if (e.key === "ArrowLeft") { e.preventDefault(); lightboxPrev(); }
      if (e.key === "ArrowRight") { e.preventDefault(); lightboxNext(); }
    }
  });
}
// Loader on Tilda injects this HTML after DOMContentLoaded — boot immediately in that case.
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", bootWhattobuysale);
} else {
  bootWhattobuysale();
}
</script>
</div>
